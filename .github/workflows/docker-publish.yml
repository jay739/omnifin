name: Publish Docker images

on:
  push:
    tags: ["v*"]

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Install API documentation generator
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build application and assets
        run: make all

      - name: Test release source
        run: go test -tags "e2ee goolm" -p 1 ./...

  build-and-push:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      version: ${{ steps.tags.outputs.version }}
      created: ${{ steps.tags.outputs.created }}
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          GHCR="ghcr.io/${{ github.repository_owner }}/omnifin"
          TAGS="${GHCR}:${VERSION},${GHCR}:latest"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            DOCKERHUB="${DOCKERHUB_USERNAME}/omnifin"
            TAGS="${DOCKERHUB}:${VERSION},${DOCKERHUB}:latest,${TAGS}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          BUILD_TIME=$(date +%s)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@${BUILD_TIME}" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for metadata verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: omnifin-metadata:check
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.build_time }}
            BUILD_DATE=${{ steps.tags.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify executable and image metadata
        run: >-
          python3 scripts/verify-image-metadata.py
          --image omnifin-metadata:check
          --version '${{ steps.tags.outputs.version }}'
          --revision '${{ github.sha }}'
          --created '${{ steps.tags.outputs.created }}'
          --source '${{ github.server_url }}/${{ github.repository }}'

      - name: Build and push multi-arch image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.build_time }}
            BUILD_DATE=${{ steps.tags.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  record-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build-and-push.outputs.version }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      BUILD_DATE: ${{ needs.build-and-push.outputs.created }}
    steps:
      - name: Write source-to-image mapping
        run: |
          python3 - <<'PYCODE'
          import json, os
          record = {
              "version": os.environ["RELEASE_VERSION"],
              "source_commit": os.environ["GITHUB_SHA"],
              "image": "ghcr.io/" + os.environ["GITHUB_REPOSITORY_OWNER"] + "/omnifin:" + os.environ["GITHUB_REF_NAME"],
              "manifest_digest": os.environ["IMAGE_DIGEST"],
              "created": os.environ["BUILD_DATE"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "build_run": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          with open("image-digests.json", "w") as output:
              json.dump(record, output, indent=2)
              output.write("\n")
          PYCODE
      - name: Attach image mapping to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Container artifacts for $GITHUB_REF_NAME." || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" image-digests.json --repo "$GITHUB_REPOSITORY" --clobber
