name: CI - build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: this workflow only needs to read the repo to
# build + test. No write access to issues, PRs, packages, deployments, etc.
permissions:
  contents: read

jobs:
  # Skip the build job for documentation that does not feed the build.
  # LICENSE is copied into build assets, so changes to it count as code.
  # A job-level condition preserves the required check for docs-only PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep='^LICENSE$'
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so `git describe --tags` (used by the Makefile
          # to derive CSSVERSION) produces a real version instead of an empty string.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm deps
        run: npm ci || npm install

      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          # setup-go adds ~/go/bin to PATH for subsequent steps, but be explicit:
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build all (docs + web assets + binary)
        run: make all

      # go vet on the inherited upstream code surfaces several pre-existing style
      # issues (unkeyed struct literals, etc.) that aren't worth fixing in this
      # fork. Keep it as an advisory step so the warnings stay visible in CI
      # but don't fail the build.
      - name: Go vet (advisory)
        continue-on-error: true
        run: go vet -tags "e2ee goolm" ./...

      - name: Go test
        run: go test -tags "e2ee goolm" -p 1 ./...
